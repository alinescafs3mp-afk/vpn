name: round6-delivery-recovery
on:
  push:
    branches: ['audit/round6-delivery-cf61932']
    paths: ['.github/workflows/audit-round6-delivery.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: cf619323be36130977dfd27832a495a442cb3b6a
          persist-credentials: false
      - name: Export exact committed audit files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p round6-delivery
          cp for_fix/ASTRA_HARD_AUDIT_ROUND6_2026-10-03.md round6-delivery/
          cp for_fix/ROUND6_EVIDENCE_2026-10-03.json round6-delivery/
          git rev-parse HEAD > round6-delivery/delivery-commit.txt
          git ls-tree HEAD for_fix/ASTRA_HARD_AUDIT_ROUND6_2026-10-03.md for_fix/ROUND6_EVIDENCE_2026-10-03.json > round6-delivery/git-blobs.txt
          sha256sum round6-delivery/*.md round6-delivery/*.json > round6-delivery/sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: round6-committed-delivery
          path: round6-delivery/
          if-no-files-found: error
          retention-days: 14
