name: astra-offline-toolchain
on:
  push:
    branches: [implementation/astra-r1]
    paths: [.github/workflows/astra-toolchain.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore exact existing dependency graph
        run: dotnet restore AutoVpn.slnx --nologo -p:EnableWindowsTargeting=true
      - name: Export isolated SDK and public NuGet cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p offline/sdk offline/nuget
          dotnet --info > offline/environment.txt
          sdk=$(dotnet --version)
          root=$(dirname "$(readlink -f "$(command -v dotnet)")")
          runtime=$(dotnet --list-runtimes | awk '$1=="Microsoft.NETCore.App" && $2 ~ /^10\./ {print $2}' | sort -V | tail -1)
          cp "$root/dotnet" offline/sdk/
          for path in "sdk/$sdk" "host/fxr/$runtime" "shared/Microsoft.NETCore.App/$runtime"; do
            mkdir -p "offline/sdk/$(dirname "$path")"
            cp -a "$root/$path" "offline/sdk/$path"
          done
          cp -a "$root/packs" offline/sdk/
          cp -a "$HOME/.nuget/packages/." offline/nuget/
          tar -czf astra-toolchain.tar.gz -C offline .
          sha256sum astra-toolchain.tar.gz > astra-toolchain.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: astra-offline-toolchain
          path: |
            astra-toolchain.tar.gz
            astra-toolchain.sha256
          retention-days: 2
