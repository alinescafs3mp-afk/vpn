name: astra-offline-toolchain
on:
  workflow_dispatch:
  push:
    branches: [implementation/astra-v3b]
    paths: ['.github/workflows/astra-offline-toolchain.yml']
permissions:
  contents: read
  actions: read
jobs:
  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Retrieve already-provisioned exact toolchain
        uses: actions/download-artifact@v4
        with:
          repository: alinescafs3mp-afk/vpn
          run-id: 37219243043
          github-token: ${{ github.token }}
          name: AutoVPN-offline-toolchain-cecb3c3814d39336a4c7f3086c2bde2b2f17ec4f
          path: artifacts
      - name: Split without modifying the archive
        shell: bash
        run: |
          set -euo pipefail
          sha256sum artifacts/autovpn-offline-toolchain.tar.gz > artifacts/SHA256SUMS.txt
          split -b 350M -d -a 2 artifacts/autovpn-offline-toolchain.tar.gz artifacts/toolchain-part-
          test -f artifacts/toolchain-part-00
          test -f artifacts/toolchain-part-01
          test ! -f artifacts/toolchain-part-02
          sha256sum artifacts/toolchain-part-* >> artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AutoVPN-toolchain-part-00-${{ github.sha }}
          path: artifacts/toolchain-part-00
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: AutoVPN-toolchain-part-01-${{ github.sha }}
          path: artifacts/toolchain-part-01
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: AutoVPN-toolchain-checksums-${{ github.sha }}
          path: artifacts/SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error
