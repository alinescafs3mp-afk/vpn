name: astra-v3b-exact-source-import
on:
  workflow_dispatch:
  push:
    branches: [implementation/astra-v3b]
    paths: ['.github/workflows/astra-v3b-import.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/astra-v3-verified
          fetch-depth: 1
      - name: Check immutable import parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = dd3361cc5585826b26759078501ec35fe3b36281
          test -z "$(git status --porcelain)"
      - name: Reassemble and authenticate exact source diff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess
          blobs = '''239e44b3aec1b3199d78d5874644d9845d5773c0
          c2c3947e197a1444c2844b34c851b425727c19e9
          bdc241b71d47235e876d954e9f590286b32603f8
          bba54bfdd306d7e174a87edd632ccdce6bdb9ec0
          248b84249fd0b08889cfa506fd226528a046d810
          95d08caf115e2176ef71e17874f6989883711f7d
          ec75184ea4b8da4766d2a9ff0792f3b13edf6f7c
          e5ec4feab6259c64d40c58c5044b11f917b180c6
          6012366166b2ec8c751408d282b86a5ca00576f7
          8543a2d421aac785bb0ff14ff883918f00ca5871
          72f725a065c1ad36f9a331c167f1ffc752060d43
          4bbe019b02d847765104b5fdca502dce860a9f0f'''.split()
          parts = []
          for index, sha in enumerate(blobs):
              result = json.loads(subprocess.check_output(['gh', 'api', 'repos/alinescafs3mp-afk/vpn/git/blobs/' + sha], timeout=30))
              if result['encoding'] != 'base64':
                  raise RuntimeError('Unexpected blob encoding')
              data = base64.b64decode(''.join(result['content'].split()), validate=True)
              expected_length = 4096 if index < 11 else 1312
              if len(data) != expected_length or hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() != sha:
                  raise RuntimeError('Transfer fragment integrity failure')
              parts.append(data)
          packed = b''.join(parts)
          if len(packed) != 46368 or hashlib.sha256(packed).hexdigest() != '1b1404fb1feb0e0aef48c8dac6d39a55e0dcd0ef6e1875372aba47ccce190eaf':
              raise RuntimeError('Compressed diff integrity failure')
          decoder = lzma.LZMADecompressor(memlimit=128 * 1024 * 1024)
          patch = decoder.decompress(packed, max_length=219696)
          if not decoder.eof or decoder.unused_data or len(patch) != 219695 or hashlib.sha256(patch).hexdigest() != '911fd42b5787efcd16b9dcdd457e915a14be3fdc508cfc69a4259fc6eaf775f6':
              raise RuntimeError('Source diff integrity failure')
          pathlib.Path(os.environ['RUNNER_TEMP'], 'v3b-import.patch').write_bytes(patch)
          print('Verified 12 transfer fragments and exact 219695-byte source diff.')
          PY
      - name: Apply without touching workflows and verify complete tree
        shell: bash
        run: |
          set -euo pipefail
          git apply --check "$RUNNER_TEMP/v3b-import.patch"
          git apply --index "$RUNNER_TEMP/v3b-import.patch"
          git diff --cached --check
          test -z "$(git diff --cached --name-only -- .github)"
          test -z "$(git diff --cached --name-only --diff-filter=D)"
          test "$(git write-tree)" = 6ef182971cfd6c3691bf5f00c0a157d1118d8a0b
          git config user.name 'Astra'
          git config user.email 'astra@autovpn.local'
          git commit -m 'feat(v3b): integrate live catalogue, owned replacement and consent-safe lifecycle'
          git push origin HEAD:refs/heads/implementation/astra-v3-verified
          mkdir -p artifacts/import-evidence
          git rev-parse HEAD > artifacts/import-evidence/source-commit.txt
          git rev-parse HEAD^{tree} > artifacts/import-evidence/source-tree.txt
          sha256sum "$RUNNER_TEMP/v3b-import.patch" > artifacts/import-evidence/patch-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AutoVPN-V3B-import-${{ github.sha }}
          path: artifacts/import-evidence/
          retention-days: 30
          if-no-files-found: error
