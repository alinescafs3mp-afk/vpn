name: astra-r1-validation
on:
  push:
    branches: [main, implementation/astra-r1]
    paths: ['src/**', 'scripts/**', 'tests/**', 'config/**', 'AutoVpn.slnx', 'Directory.Build.props', 'docs/ASTRA_BUILD_CHECK.md', '.github/workflows/astra-r1-ci.yml']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Normal tests
        shell: pwsh
        run: ./scripts/test.ps1
      - name: Preserve normal test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-r1-unit-${{ matrix.os }}
          path: artifacts/test-results/
      - name: Pinned non-TUN native tests
        if: always()
        shell: pwsh
        run: |
          $core = ./scripts/fetch-core.ps1
          ./scripts/test.ps1 -Native -CorePath $core
      - name: Preserve native results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-r1-native-${{ matrix.os }}
          path: artifacts/test-results/
      - name: Actual Windows UI and same-process reopen
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet run --project tests/AutoVpn.AuditRound6Wpf -c Release -- artifacts/wpf-smoke
          exit $LASTEXITCODE
      - name: Preserve UI evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: astra-r1-wpf
          path: artifacts/wpf-smoke/
  development-package:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Publish DEVELOPMENT executable bundle
        shell: pwsh
        run: |
          ./scripts/package.ps1
          ./scripts/verify-release.ps1 -PackageDirectory artifacts/AutoVPN-astra-r1-win-x64-development
      - uses: actions/upload-artifact@v4
        with:
          name: AutoVPN-astra-r1-DEVELOPMENT-win-x64
          path: |
            artifacts/AutoVPN-astra-r1-win-x64-development.zip
            artifacts/AutoVPN-astra-r1-win-x64-development.zip.sha256
