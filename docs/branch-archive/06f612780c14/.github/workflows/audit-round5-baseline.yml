name: independent-round5-baseline
on:
  push:
    branches: ['audit/round5-49e5bd5-independent']
    paths: ['.github/workflows/audit-round5-baseline.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Export exact production bytes and history without local config
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-source
          git archive --format=tar 49e5bd54e41731b9b96b83789def31e86c701ee6 > audit-source/production.tar
          git ls-tree -r 49e5bd54e41731b9b96b83789def31e86c701ee6 > audit-source/tree.txt
          git log --format='%H %T %s' 49e5bd54e41731b9b96b83789def31e86c701ee6 > audit-source/history.txt
          git diff --stat 12c4b920a478a6f66945d7d7512d9ada319a559c 49e5bd54e41731b9b96b83789def31e86c701ee6 > audit-source/changes.txt
          git bundle create audit-source/production.bundle main
          sha256sum audit-source/* > audit-source/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: round5-production-source
          path: audit-source/
          retention-days: 14
  baseline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build exact production
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force audit-results | Out-Null
          dotnet --info > audit-results/environment.txt
          dotnet build AutoVpn.slnx -c Release --nologo
          exit $LASTEXITCODE
      - name: Full existing suite without optional native core
        id: tests
        continue-on-error: true
        shell: pwsh
        env:
          AUTOVPN_MIHOMO_PATH: ''
        run: |
          dotnet test tests/AutoVpn.UnitTests/AutoVpn.UnitTests.csproj -c Release --no-build --nologo --logger 'trx;LogFileName=baseline.trx' --results-directory audit-results --blame-hang-timeout 90s
          exit $LASTEXITCODE
      - name: Transitive advisory query
        id: advisories
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet list AutoVpn.slnx package --vulnerable --include-transitive --format json | Tee-Object audit-results/nuget-vulnerabilities.json
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round5-baseline-${{ matrix.os }}
          path: audit-results/
          retention-days: 14
      - name: Preserve failure status
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.tests.outcome }}' -ne 'success' -or '${{ steps.advisories.outcome }}' -ne 'success') { exit 1 }
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Exact official core with archive and binary hash checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-results
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 120 https://github.com/MetaCubeX/mihomo/releases/download/v1.19.32/mihomo-linux-amd64-v1.19.32.gz -o "$RUNNER_TEMP/mihomo.gz"
          echo "8451100836c9eda194331c2babfad490b2faf30cebc1a04b0e76fd8ac2d35d10  $RUNNER_TEMP/mihomo.gz" | sha256sum -c
          gzip -dc "$RUNNER_TEMP/mihomo.gz" > "$RUNNER_TEMP/mihomo"
          echo "3122d100e8177501776109f1a6253a694611627cf4d7c7ec82705855cf8626a8  $RUNNER_TEMP/mihomo" | sha256sum -c
          chmod 700 "$RUNNER_TEMP/mihomo"
          "$RUNNER_TEMP/mihomo" -v | tee audit-results/core-version.txt
          echo "AUTOVPN_MIHOMO_PATH=$RUNNER_TEMP/mihomo" >> "$GITHUB_ENV"
      - name: Full existing suite with real non-TUN native checks
        shell: bash
        run: dotnet test tests/AutoVpn.UnitTests/AutoVpn.UnitTests.csproj -c Release --nologo --logger 'trx;LogFileName=native.trx' --results-directory audit-results --blame-hang-timeout 90s
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round5-native-baseline
          path: audit-results/
          retention-days: 14
