name: independent-round6-handshakes
on:
  push:
    branches: ['audit/round6-bee2602-independent']
    paths: ['.github/workflows/audit-round6-handshakes.yml', 'tests/AutoVpn.UnitTests/Round6NativeHandshakeTests.cs']
permissions:
  contents: read
jobs:
  handshake:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Provision exact official core
        run: |
          New-Item -ItemType Directory -Force audit-results | Out-Null
          git rev-parse HEAD | Out-File audit-results/commit.txt
          @'
          import gzip, hashlib, io, json, os, pathlib, urllib.request, zipfile
          m=json.loads(pathlib.Path('config/core-manifest.json').read_text()); hashes={a['name']:a['sha256'] for a in m['assets']}
          win=os.name=='nt'; name='mihomo-windows-amd64-v1.19.32.zip' if win else 'mihomo-linux-amd64-v1.19.32.gz'
          raw=urllib.request.urlopen('https://github.com/MetaCubeX/mihomo/releases/download/v1.19.32/'+name,timeout=45).read()
          assert hashlib.sha256(raw).hexdigest()==hashes[name]
          if win:
              z=zipfile.ZipFile(io.BytesIO(raw)); names=[n for n in z.namelist() if n.endswith('.exe')]; assert len(names)==1
              binary=z.read(names[0]); bn='mihomo-windows-amd64.exe'
          else:
              binary=gzip.decompress(raw); bn='mihomo-linux-amd64'
          digest=hashlib.sha256(binary).hexdigest(); assert digest==hashes[bn]
          dest=pathlib.Path(os.environ['RUNNER_TEMP'])/('round6-handshake.exe' if win else 'round6-handshake');dest.write_bytes(binary);dest.chmod(0o700)
          pathlib.Path('audit-results/core.json').write_text(json.dumps({'version':m['version'],'source_commit':m['commit'],'archive_sha256':hashlib.sha256(raw).hexdigest(),'binary_sha256':digest}))
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write('R5_CORE_PATH='+str(dest)+'\nR5_CORE_HASH='+digest+'\n')
          '@ | python -
          exit $LASTEXITCODE
      - name: Actual protocol and wrong-credential controls through production transport
        run: |
          dotnet test tests/AutoVpn.UnitTests/AutoVpn.UnitTests.csproj -c Release --nologo --filter FullyQualifiedName~Round6NativeHandshakeTests --logger 'trx;LogFileName=handshakes.trx' --results-directory audit-results --blame-hang-timeout 120s
          exit $LASTEXITCODE
      - name: Preserve exact fixture
        if: always()
        run: Copy-Item tests/AutoVpn.UnitTests/Round6NativeHandshakeTests.cs audit-results/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round6-handshakes-${{ matrix.os }}
          path: audit-results/
          retention-days: 14
