name: astra-offline-toolchain
on:
  push:
    branches: [implementation/astra-r6-20261004]
    paths: [.github/workflows/astra-offline-toolchain.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore exact build and Windows packaging inputs
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore AutoVpn.slnx
          dotnet restore AutoVpn.slnx -r win-x64
          dotnet restore AutoVpn.slnx -r linux-x64
          mkdir -p /tmp/astra-extra
          cat > /tmp/astra-extra/deps.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net10.0</TargetFramework></PropertyGroup><ItemGroup><PackageReference Include="System.ServiceProcess.ServiceController" Version="10.0.12" /><PackageReference Include="System.IO.Pipes.AccessControl" Version="5.0.0" /><PackageReference Include="Microsoft.Extensions.Hosting.WindowsServices" Version="10.0.12" /></ItemGroup></Project>
          EOF
          dotnet restore /tmp/astra-extra/deps.csproj
      - name: Export SDK, package cache and exact non-TUN test core
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p offline-export
          python3 - <<'PY'
          import gzip,hashlib,json,os,pathlib,subprocess,tarfile,urllib.request
          out=pathlib.Path('offline-export')
          root=pathlib.Path(os.path.realpath(subprocess.check_output(['which','dotnet'],text=True).strip())).parent
          manifest=json.loads(pathlib.Path('config/core-manifest.json').read_text())
          expected={a['name']:a['sha256'] for a in manifest['assets']}
          url='https://github.com/MetaCubeX/mihomo/releases/download/v1.19.32/mihomo-linux-amd64-v1.19.32.gz'
          data=urllib.request.urlopen(url,timeout=90).read()
          assert hashlib.sha256(data).hexdigest()==expected['mihomo-linux-amd64-v1.19.32.gz']
          raw=gzip.decompress(data)
          assert hashlib.sha256(raw).hexdigest()==expected['mihomo-linux-amd64']
          (out/'mihomo').write_bytes(raw);(out/'mihomo').chmod(0o755)
          with tarfile.open(out/'sdk-packages.tar.xz','w:xz',preset=3) as tar:
              for name in ['dotnet','LICENSE.txt','ThirdPartyNotices.txt','sdk/10.0.112']:
                  p=root/name
                  if p.exists():tar.add(p,arcname='dotnet/'+name)
              for name in ['host/fxr','shared/Microsoft.NETCore.App','shared/Microsoft.AspNetCore.App']:
                  p=root/name
                  if p.exists():
                      children=sorted(p.iterdir(),key=lambda x:tuple(int(y) for y in x.name.split('.') if y.isdigit()))
                      selected=[x for x in children if x.name=='10.0.12']
                      for x in selected:tar.add(x,arcname='dotnet/'+name+'/'+x.name)
              p=root/'packs'
              if p.exists():
                  for family in p.iterdir():
                      for version in family.iterdir():
                          if version.name.startswith('10.0.'):
                              tar.add(version,arcname='dotnet/packs/'+family.name+'/'+version.name)
              tar.add(pathlib.Path.home()/'.nuget/packages',arcname='packages')
          for p in sorted(out.iterdir()):
              if p.is_file():print(p.name,p.stat().st_size,hashlib.sha256(p.read_bytes()).hexdigest())
          PY
          sha256sum offline-export/* > offline-export/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: astra-offline-toolchain
          path: offline-export/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
