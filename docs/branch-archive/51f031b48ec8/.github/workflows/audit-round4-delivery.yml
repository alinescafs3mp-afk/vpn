name: round4-delivery-recovery
on:
  push:
    branches: ['audit/round4-delivery-8ee0c71']
    paths: ['.github/workflows/audit-round4-delivery.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 8ee0c71a294d587c6a8188aee1f1e0581d30212d
          persist-credentials: false
      - name: Verify exact audit files and export their committed bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery
          test "$(git hash-object for_fix/ASTRA_HARD_AUDIT_ROUND4_2026-10-03.md)" = beb2f4ce4d94f8fc0d2cd3857cb5b688436c7201
          test "$(git hash-object for_fix/ROUND4_EVIDENCE_2026-10-03.json)" = 58f2c32bf3807076ef1163958b206ce192a79554
          cp for_fix/ASTRA_HARD_AUDIT_ROUND4_2026-10-03.md delivery/
          cp for_fix/ROUND4_EVIDENCE_2026-10-03.json delivery/
          git rev-parse HEAD HEAD^{tree} > delivery/COMMITTED_IDENTITIES.txt
          sha256sum delivery/*.md delivery/*.json > delivery/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: round4-committed-delivery
          path: delivery/
          retention-days: 14
          if-no-files-found: error
