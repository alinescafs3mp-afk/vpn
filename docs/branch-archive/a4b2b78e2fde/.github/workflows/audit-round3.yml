name: independent-round3-audit
on:
  push:
    branches: ['audit/round3-e7797c7-independent']
permissions:
  contents: read
concurrency:
  group: independent-round3-${{ github.ref }}
  cancel-in-progress: true
jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build audited code and added tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force audit-results | Out-Null
          git rev-parse HEAD
          git ls-tree -r HEAD > audit-results/source-inventory.txt
          dotnet --info
          dotnet build AutoVpn.slnx -c Release --nologo
          exit $LASTEXITCODE
      - name: Independent counterexamples (failures are findings)
        id: independent
        continue-on-error: true
        shell: pwsh
        run: |
          $filter = 'FullyQualifiedName~IndependentRound3Tests'
          if ($IsWindows) { $filter += '&FullyQualifiedName!~A16_OutputDrain' }
          dotnet test tests/AutoVpn.UnitTests/AutoVpn.UnitTests.csproj -c Release --no-build --nologo --filter $filter --logger 'trx;LogFileName=independent.trx' --results-directory audit-results --blame-hang-timeout 90s
          exit $LASTEXITCODE
        env:
          AUTOVPN_MIHOMO_PATH: ''
      - name: Existing tests without optional native core
        id: baseline
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet test tests/AutoVpn.UnitTests/AutoVpn.UnitTests.csproj -c Release --no-build --nologo --filter 'FullyQualifiedName!~IndependentRound3Tests' --logger 'trx;LogFileName=baseline.trx' --results-directory audit-results --blame-hang-timeout 90s
          exit $LASTEXITCODE
        env:
          AUTOVPN_MIHOMO_PATH: ''
      - name: Transitive NuGet vulnerability query
        id: vulnerabilities
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet list AutoVpn.slnx package --vulnerable --include-transitive --format json | Tee-Object -FilePath audit-results/nuget-vulnerabilities.json
          exit $LASTEXITCODE
      - name: Preserve results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-round3-${{ matrix.os }}
          path: audit-results/
          retention-days: 14
      - name: Expose failed test outcomes
        if: always()
        shell: pwsh
        run: |
          Write-Host 'Independent tests: ${{ steps.independent.outcome }}'
          Write-Host 'Existing tests: ${{ steps.baseline.outcome }}'
          Write-Host 'Vulnerability query: ${{ steps.vulnerabilities.outcome }}'
          if ('${{ steps.independent.outcome }}' -ne 'success' -or '${{ steps.baseline.outcome }}' -ne 'success') { exit 1 }
  pinned-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Obtain and verify the exact pinned official Linux core
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-results
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 120 'https://github.com/MetaCubeX/mihomo/releases/download/v1.19.32/mihomo-linux-amd64-v1.19.32.gz' -o "$RUNNER_TEMP/mihomo-audit.gz"
          echo "8451100836c9eda194331c2babfad490b2faf30cebc1a04b0e76fd8ac2d35d10  $RUNNER_TEMP/mihomo-audit.gz" | sha256sum --check
          gzip -dc "$RUNNER_TEMP/mihomo-audit.gz" > "$RUNNER_TEMP/mihomo-audit"
          echo "3122d100e8177501776109f1a6253a694611627cf4d7c7ec82705855cf8626a8  $RUNNER_TEMP/mihomo-audit" | sha256sum --check
          chmod 700 "$RUNNER_TEMP/mihomo-audit"
          echo "AUTOVPN_MIHOMO_PATH=$RUNNER_TEMP/mihomo-audit" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/mihomo-audit" -v
      - name: Existing controlled non-TUN native suite
        shell: bash
        run: |
          set -euo pipefail
          dotnet test tests/AutoVpn.UnitTests/AutoVpn.UnitTests.csproj -c Release --nologo --filter 'FullyQualifiedName!~IndependentRound3Tests' --logger 'trx;LogFileName=native.trx' --results-directory audit-results --blame-hang-timeout 90s
      - name: Preserve native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-round3-pinned-core
          path: audit-results/
          retention-days: 14
