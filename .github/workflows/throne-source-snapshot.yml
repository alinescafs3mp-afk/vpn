name: Throne source snapshot
on:
  push:
    branches: [main]
    paths: [.github/workflows/throne-source-snapshot.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export tracked source and its identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/throne-source"
          git archive --format=tar HEAD -o "$RUNNER_TEMP/throne-source/source.tar"
          git rev-parse HEAD > "$RUNNER_TEMP/throne-source/commit.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/throne-source/tree.txt"
          sha256sum "$RUNNER_TEMP/throne-source/source.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: throne-source-${{ github.sha }}
          path: ${{ runner.temp }}/throne-source/
          if-no-files-found: error
          retention-days: 7
