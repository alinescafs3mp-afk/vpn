name: astra-env-split
on:
  push:
    branches: [astra/implementation-r6]
    paths: [.github/workflows/astra-env-split.yml]
permissions:
  contents: read
  actions: read
jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37144822966
          name: astra-offline-toolchain
          path: env
      - run: |
          mkdir parts
          split -b 330000000 env/autovpn-build-env.tar.gz parts/toolchain-
          sha256sum parts/* > parts/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: astra-toolchain-aa
          path: parts/toolchain-aa
          compression-level: 0
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: astra-toolchain-ab
          path: parts/toolchain-ab
          compression-level: 0
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: astra-toolchain-hashes
          path: parts/SHA256SUMS.txt
          retention-days: 2
