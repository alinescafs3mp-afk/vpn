name: independent-round4-audit
on:
  push:
    branches: ['audit/round4-12c4b92-independent']
    paths: ['.github/workflows/audit-round4.yml', 'tests/AutoVpn.UnitTests/IndependentRound4*', 'tests/AutoVpn.AuditRound4/**']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Export immutable production snapshot and its history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-export
          git archive --format=zip 12c4b920a478a6f66945d7d7512d9ada319a559c > audit-export/production-source.zip
          git ls-tree -r 12c4b920a478a6f66945d7d7512d9ada319a559c > audit-export/production-tree.txt
          git rev-parse 12c4b920a478a6f66945d7d7512d9ada319a559c^{tree} > audit-export/root-tree.txt
          git log --format='%H %P %s' 12c4b920a478a6f66945d7d7512d9ada319a559c > audit-export/history.txt
          git diff fcfe09428d6d18c3d0e39f7fc134f73f287dad20 12c4b920a478a6f66945d7d7512d9ada319a559c > audit-export/round3-remediation.patch
          git bundle create audit-export/history.bundle HEAD
          git archive --format=zip HEAD > audit-export/audit-source.zip
          sha256sum audit-export/* > audit-export/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: round4-source-export
          path: audit-export/
          retention-days: 14
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json
      - name: Build unchanged production code plus audit fixtures
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force audit-results | Out-Null
          git rev-parse HEAD | Set-Content audit-results/commit.txt
          dotnet --info | Tee-Object audit-results/environment.txt
          dotnet build AutoVpn.slnx -c Release --nologo
          exit $LASTEXITCODE
      - name: Existing full suite including ported round-3 regressions
        id: baseline
        continue-on-error: true
        shell: pwsh
        env:
          AUTOVPN_MIHOMO_PATH: ''
        run: |
          dotnet test tests/AutoVpn.UnitTests/AutoVpn.UnitTests.csproj -c Release --no-build --nologo --filter 'FullyQualifiedName!~IndependentRound4' --logger 'trx;LogFileName=baseline.trx' --results-directory audit-results --blame-hang-timeout 90s
          exit $LASTEXITCODE
      - name: Round-4 counterexamples when present
        id: counterexamples
        continue-on-error: true
        shell: pwsh
        env:
          AUTOVPN_MIHOMO_PATH: ''
        run: |
          if (@(Get-ChildItem tests/AutoVpn.UnitTests/IndependentRound4*.cs -ErrorAction SilentlyContinue).Count -eq 0) {
            'NOT_RUN: round-4 fixtures not yet added' | Set-Content audit-results/round4-status.txt
            exit 0
          }
          dotnet test tests/AutoVpn.UnitTests/AutoVpn.UnitTests.csproj -c Release --no-build --nologo --filter 'FullyQualifiedName~IndependentRound4' --logger 'trx;LogFileName=round4.trx' --results-directory audit-results --blame-hang-timeout 90s
          exit $LASTEXITCODE
      - name: Query transitive NuGet advisories
        id: advisories
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet list AutoVpn.slnx package --vulnerable --include-transitive --format json | Tee-Object audit-results/nuget-advisories.json
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: round4-${{ matrix.os }}
          path: audit-results/
          retention-days: 14
      - name: Preserve honest failure status
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.baseline.outcome }}' -ne 'success' -or '${{ steps.counterexamples.outcome }}' -ne 'success' -or '${{ steps.advisories.outcome }}' -ne 'success') { exit 1 }
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json
      - name: Stage exact verified pinned official non-TUN core
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-native
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 120 https://github.com/MetaCubeX/mihomo/releases/download/v1.19.32/mihomo-linux-amd64-v1.19.32.gz -o "$RUNNER_TEMP/audit-mihomo.gz"
          echo "8451100836c9eda194331c2babfad490b2faf30cebc1a04b0e76fd8ac2d35d10  $RUNNER_TEMP/audit-mihomo.gz" | sha256sum --check
          gzip -dc "$RUNNER_TEMP/audit-mihomo.gz" > "$RUNNER_TEMP/audit-mihomo"
          echo "3122d100e8177501776109f1a6253a694611627cf4d7c7ec82705855cf8626a8  $RUNNER_TEMP/audit-mihomo" | sha256sum --check
          chmod 700 "$RUNNER_TEMP/audit-mihomo"
          echo "AUTOVPN_MIHOMO_PATH=$RUNNER_TEMP/audit-mihomo" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/audit-mihomo" -v | tee audit-native/core-version.txt
      - name: Existing native positive and negative controls
        shell: bash
        run: |
          dotnet test tests/AutoVpn.UnitTests/AutoVpn.UnitTests.csproj -c Release --nologo --filter 'FullyQualifiedName!~IndependentRound4' --logger 'trx;LogFileName=native.trx' --results-directory audit-native --blame-hang-timeout 90s
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: round4-native
          path: audit-native/
          retention-days: 14
