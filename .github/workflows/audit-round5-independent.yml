name: independent-round5-counterexamples
on:
  push:
    branches: ['audit/round5-49e5bd5-independent']
    paths:
      - '.github/workflows/audit-round5-independent.yml'
      - 'tests/AutoVpn.UnitTests/IndependentRound5*'
permissions:
  contents: read
jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Compile unchanged application plus adverse tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force audit-results | Out-Null
          git rev-parse HEAD > audit-results/commit.txt
          dotnet --info > audit-results/environment.txt
          dotnet build AutoVpn.slnx -c Release --nologo
          exit $LASTEXITCODE
      - name: Independent counterexamples and positive controls
        shell: pwsh
        run: |
          dotnet test tests/AutoVpn.UnitTests/AutoVpn.UnitTests.csproj -c Release --no-build --nologo --filter 'FullyQualifiedName~IndependentRound5&FullyQualifiedName!~Native_Round5' --logger 'trx;LogFileName=independent.trx' --results-directory audit-results --blame-hang-timeout 90s
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round5-independent-${{ matrix.os }}
          path: audit-results/
          retention-days: 14
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Download and verify exact platform core
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force audit-results | Out-Null
          $manifest = Get-Content config/core-manifest.json -Raw | ConvertFrom-Json
          if ($IsWindows) { $archiveName='mihomo-windows-amd64-v1.19.32.zip'; $binaryName='mihomo-windows-amd64.exe' }
          else { $archiveName='mihomo-linux-amd64-v1.19.32.gz'; $binaryName='mihomo-linux-amd64' }
          $archivePath=Join-Path $env:RUNNER_TEMP $archiveName
          Invoke-WebRequest -Uri "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.32/$archiveName" -OutFile $archivePath -TimeoutSec 120
          $expectedArchive=($manifest.assets | Where-Object name -eq $archiveName).sha256
          if ((Get-FileHash $archivePath -Algorithm SHA256).Hash -ne $expectedArchive) { throw 'Archive hash mismatch' }
          $binaryPath=Join-Path $env:RUNNER_TEMP $binaryName
          if ($IsWindows) {
            $expanded=Join-Path $env:RUNNER_TEMP 'round5-core-extracted'
            Expand-Archive $archivePath $expanded
            $executables=@(Get-ChildItem $expanded -Recurse -File -Filter '*.exe')
            if ($executables.Count -ne 1) { throw 'Unexpected archive member layout' }
            Copy-Item $executables[0].FullName $binaryPath
          } else {
            $inputStream=[IO.File]::OpenRead($archivePath)
            $gzip=[IO.Compression.GZipStream]::new($inputStream,[IO.Compression.CompressionMode]::Decompress)
            $outputStream=[IO.File]::Create($binaryPath)
            try { $gzip.CopyTo($outputStream) } finally { $outputStream.Dispose(); $gzip.Dispose(); $inputStream.Dispose() }
            chmod 700 $binaryPath
            if ($LASTEXITCODE -ne 0) { throw 'chmod failed' }
          }
          $expectedBinary=($manifest.assets | Where-Object name -eq $binaryName).sha256
          if ((Get-FileHash $binaryPath -Algorithm SHA256).Hash -ne $expectedBinary) { throw 'Binary hash mismatch' }
          "R5_CORE_PATH=$binaryPath" >> $env:GITHUB_ENV
          "R5_CORE_HASH=$expectedBinary" >> $env:GITHUB_ENV
          & $binaryPath -v | Tee-Object audit-results/core-version.txt
          @{ archive=$archiveName;archiveHash=$expectedArchive;binary=$binaryName;binaryHash=$expectedBinary;verified=$true } | ConvertTo-Json > audit-results/core-identity.json
      - name: Native profile matrix and controlled candidate positive-negative test
        shell: pwsh
        run: |
          dotnet test tests/AutoVpn.UnitTests/AutoVpn.UnitTests.csproj -c Release --nologo --filter 'FullyQualifiedName~Native_Round5' --logger 'trx;LogFileName=native.trx' --results-directory audit-results --blame-hang-timeout 120s
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round5-native-${{ matrix.os }}
          path: audit-results/
          retention-days: 14
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - shell: bash
        run: |
          mkdir audit-fixtures
          git archive --format=tar HEAD > audit-fixtures/audit-source.tar
          git ls-tree -r HEAD > audit-fixtures/audit-tree.txt
          git rev-parse HEAD > audit-fixtures/audit-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: round5-independent-fixtures
          path: audit-fixtures/
          retention-days: 14
