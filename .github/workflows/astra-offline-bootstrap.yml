name: astra-offline-bootstrap
on:
  push:
    branches: [impl/astra-round6-20261004]
    paths: [.github/workflows/astra-offline-bootstrap.yml]
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare private SDK and dependency cache
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/autovpn-offline"
          mkdir -p "$root/sdk" "$root/nuget" "$root/core" "$GITHUB_WORKSPACE/offline-export"
          curl --fail --location --proto '=https' --tlsv1.2 https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" --version 10.0.112 --install-dir "$root/sdk" --no-path
          export DOTNET_ROOT="$root/sdk" PATH="$root/sdk:$PATH" NUGET_PACKAGES="$root/nuget"
          dotnet --info > offline-export/dotnet-info.txt
          dotnet restore AutoVpn.slnx -p:EnableWindowsTargeting=true
          dotnet publish src/AutoVpn.Desktop/AutoVpn.Desktop.csproj -c Release -r win-x64 --self-contained true -p:EnableWindowsTargeting=true -o "$RUNNER_TEMP/desktop-check"
          curl --fail --location --proto '=https' --tlsv1.2 https://github.com/MetaCubeX/mihomo/releases/download/v1.19.32/mihomo-linux-amd64-v1.19.32.gz -o "$root/core/mihomo.gz"
          echo '8451100836c9eda194331c2babfad490b2faf30cebc1a04b0e76fd8ac2d35d10  '"$root/core/mihomo.gz" | sha256sum -c -
          gzip -d "$root/core/mihomo.gz"
          echo '3122d100e8177501776109f1a6253a694611627cf4d7c7ec82705855cf8626a8  '"$root/core/mihomo" | sha256sum -c -
          chmod 755 "$root/core/mihomo"
          tar -czf offline-export/build-environment.tar.gz -C "$root" sdk nuget core
          sha256sum offline-export/build-environment.tar.gz > offline-export/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: astra-private-build-environment
          path: offline-export/
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
