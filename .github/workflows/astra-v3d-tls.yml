name: astra-v3d-tls-investigation
on:
  workflow_dispatch:
  push:
    branches: [implementation/astra-v3d-tls]
    paths: ['tests/**', 'src/**', 'scripts/**', '.github/workflows/astra-v3d-tls.yml']
permissions:
  contents: read
jobs:
  investigate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build startup readiness proof
        shell: pwsh
        run: |
          New-Item -ItemType Directory artifacts/v3d-tls -Force | Out-Null
          dotnet build AutoVpn.slnx -c Release --nologo '-p:Platform=Any CPU'
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }
      - name: Prove listening is not dispatch readiness with a held loopback provider
        shell: pwsh
        run: |
          $core = ./scripts/fetch-core.ps1
          $manifest = Get-Content config/core-manifest.json -Raw | ConvertFrom-Json
          $asset = if ($IsWindows) { 'mihomo-windows-amd64.exe' } else { 'mihomo-linux-amd64' }
          $hash = ($manifest.assets | Where-Object name -eq $asset).sha256
          if ((Get-FileHash -LiteralPath $core -Algorithm SHA256).Hash -ne $hash) { throw 'Core hash mismatch.' }
          $env:R5_CORE_PATH = (Resolve-Path -LiteralPath $core).Path
          $env:R5_CORE_HASH = $hash
          dotnet test tests/AutoVpn.UnitTests/AutoVpn.UnitTests.csproj -c Release --no-build --nologo --filter 'FullyQualifiedName~AstraV3DStartupReadinessTests' --logger 'trx;LogFileName=startup.trx' --results-directory artifacts/v3d-tls --blame-hang-timeout 60s --blame-hang-dump-type none
          if ($LASTEXITCODE -ne 0) { throw 'Startup proof failed.' }
          [xml]$trx = Get-Content artifacts/v3d-tls/startup.trx -Raw
          $cases = @($trx.SelectNodes("//*[local-name()='UnitTestResult']"))
          if ($cases.Count -ne 8 -or @($cases | Where-Object outcome -ne 'Passed').Count -ne 0) { throw 'Incomplete proof evidence.' }
          @{sourceCommit=$env:GITHUB_SHA; cases=8; passed=8; installedService='NOT_RUN'; scope='Deterministic loopback-only startup readiness proof, not yet integrated into candidate probes'} | ConvertTo-Json | Set-Content artifacts/v3d-tls/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V3D-TLS-${{ github.sha }}-${{ matrix.os }}
          path: artifacts/v3d-tls/
          if-no-files-found: error
          retention-days: 30
