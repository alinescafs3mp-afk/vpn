name: independent-round4-extra
on:
  push:
    branches: ['audit/round4-12c4b92-independent']
    paths: ['.github/workflows/audit-round4-extra.yml', 'tests/AutoVpn.AuditRound4/**', 'tests/AutoVpn.AuditRound4Wpf/**']
permissions:
  contents: read
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with: {global-json-file: global.json}
      - name: Measure synthetic persistent catalogues through 10000 nodes
        shell: pwsh
        run: |
          dotnet run --project tests/AutoVpn.AuditRound4/AutoVpn.AuditRound4.csproj -c Release -- measure audit-extra
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: round4-measure-${{ matrix.os }}
          path: audit-extra/
          retention-days: 14
  wpf:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with: {global-json-file: global.json}
      - name: Actual WPF startup navigation and local settings controls
        shell: pwsh
        run: |
          dotnet run --project tests/AutoVpn.AuditRound4Wpf/AutoVpn.AuditRound4Wpf.csproj -c Release -- audit-wpf
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: round4-wpf
          path: audit-wpf/
          retention-days: 14
  native-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with: {global-json-file: global.json}
      - name: Validate nine synthetic non-TUN profiles using exact official core
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 120 https://github.com/MetaCubeX/mihomo/releases/download/v1.19.32/mihomo-linux-amd64-v1.19.32.gz -o "$RUNNER_TEMP/mihomo.gz"
          echo "8451100836c9eda194331c2babfad490b2faf30cebc1a04b0e76fd8ac2d35d10  $RUNNER_TEMP/mihomo.gz" | sha256sum --check
          gzip -dc "$RUNNER_TEMP/mihomo.gz" > "$RUNNER_TEMP/mihomo"
          echo "3122d100e8177501776109f1a6253a694611627cf4d7c7ec82705855cf8626a8  $RUNNER_TEMP/mihomo" | sha256sum --check
          chmod 700 "$RUNNER_TEMP/mihomo"
          dotnet run --project tests/AutoVpn.AuditRound4/AutoVpn.AuditRound4.csproj -c Release -- native audit-native-profiles "$RUNNER_TEMP/mihomo"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: round4-native-profiles
          path: audit-native-profiles/
          retention-days: 14
  upstream-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Compare reviewed frozen reference with live upstream commit metadata only
        shell: python
        run: |
          import datetime, json, pathlib, urllib.request
          out = pathlib.Path('audit-upstream'); out.mkdir()
          manifest = json.loads(pathlib.Path('config/source-manifest.json').read_text())
          req = urllib.request.Request('https://api.github.com/repos/igareck/vpn-configs-for-russia/commits/HEAD', headers={'User-Agent':'AutoVPN-independent-audit-metadata','Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req, timeout=20) as response:
              tip = json.load(response)
          result = {'observed_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(), 'configured_commit':manifest['commit'], 'configured_tree_api':manifest['treeApi'], 'upstream_head_commit':tip['sha'], 'upstream_head_tree':tip['commit']['tree']['sha'], 'upstream_commit_time':tip['commit']['committer']['date'], 'same_commit':manifest['commit']==tip['sha'], 'boundary':'One upstream metadata GET only. No subscription bodies retained and no public proxy nodes contacted.'}
          (out/'comparison.json').write_text(json.dumps(result, indent=2))
          print(json.dumps(result))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: round4-upstream-metadata
          path: audit-upstream/
          retention-days: 14
