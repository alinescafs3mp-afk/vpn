name: astra-v2-tls-diagnostics
on:
  push:
    branches: [implementation/astra-v2]
    paths: [.github/workflows/astra-v2-diagnostics.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unchanged-windows-native:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Provision exact official core and compile
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $core = ./scripts/fetch-core.ps1
          $manifest = Get-Content config/core-manifest.json -Raw | ConvertFrom-Json
          $hash = ($manifest.assets | Where-Object name -eq 'mihomo-windows-amd64.exe').sha256
          if ((Get-FileHash -LiteralPath $core -Algorithm SHA256).Hash -ne $hash) { throw 'Core mismatch' }
          "R6_CORE_PATH=$core" | Out-File $env:GITHUB_ENV -Append
          "R6_CORE_HASH=$hash" | Out-File $env:GITHUB_ENV -Append
          dotnet build AutoVpn.slnx -c Release --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - name: Repeat unchanged six-protocol TLS matrix five times
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/tls-repeat | Out-Null
          $outcomes = @()
          for ($i=1; $i -le 5; $i++) {
            dotnet test tests/AutoVpn.UnitTests/AutoVpn.UnitTests.csproj -c Release --no-build --nologo --filter 'FullyQualifiedName~Round6NativeHandshakeTests' --logger "trx;LogFileName=repeat-$i.trx" --results-directory artifacts/tls-repeat --blame-hang-timeout 90s --blame-hang-dump-type none
            $outcomes += @{ repetition = $i; exitCode = $LASTEXITCODE }
          }
          @{ sourceCommit=$env:GITHUB_SHA; base='571905cb2dc85507c0ac8182de3a43477a1a47e2'; repeatedMatrix=$outcomes; unchangedCertificatePolicy=$true; tun=$false; interpretation='A passing repeat does not diagnose or erase the earlier TLS_REJECTED event.' } | ConvertTo-Json -Depth 5 | Set-Content artifacts/tls-repeat/summary.json
          if (@($outcomes | Where-Object exitCode -ne 0).Count -gt 0) { throw 'One or more repeated runs failed; retain all results' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AutoVPN-V2-TLS-repeat
          path: artifacts/tls-repeat/
          retention-days: 30
