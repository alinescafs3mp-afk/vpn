name: independent-round3-wpf-smoke
on:
  push:
    branches: ['audit/round3-e7797c7-independent']
permissions:
  contents: read
jobs:
  wpf-smoke:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Construct and navigate actual WPF UI without network consent
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force audit-wpf-results | Out-Null
          git rev-parse HEAD
          $tracked = @(git ls-tree -r --name-only HEAD)
          Write-Host "Tracked files including audit fixtures: $($tracked.Count)"
          dotnet run --project tests/AutoVpn.AuditWpfSmoke/AutoVpn.AuditWpfSmoke.csproj -c Release -- audit-wpf-results
          exit $LASTEXITCODE
        env:
          AUTOVPN_MIHOMO_PATH: ''
      - name: Preserve actual render and smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-round3-wpf-smoke
          path: audit-wpf-results/
          retention-days: 14
