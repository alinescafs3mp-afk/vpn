name: astra-v3d-validation
on:
  workflow_dispatch:
  push:
    branches: [implementation/astra-v3d]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Full regression and bounded TLS investigation on loopback only
        shell: pwsh
        run: |
          New-Item -ItemType Directory artifacts/v3d-validation -Force | Out-Null
          $core = ./scripts/fetch-core.ps1
          try { ./scripts/test.ps1 -Native -CorePath $core *>&1 | Tee-Object artifacts/v3d-validation/test.log }
          finally {
            if (Test-Path artifacts/test-results/results.trx) {
              Copy-Item artifacts/test-results/results.trx artifacts/v3d-validation/native.trx
            }
          }
      - name: Read-only absent-service query without installation or account changes
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $text = & dotnet src/AutoVpn.Service/bin/Release/net10.0/AutoVpn.Service.dll --service-status
          $code = $LASTEXITCODE
          $text | Set-Content artifacts/v3d-validation/service-status.json -Encoding utf8NoBOM
          $status = $text | ConvertFrom-Json
          if ($code -ne 6 -or $status.state -cne 'NotInstalled') { throw 'Expected an absent service on the fresh runner.' }
          $global:LASTEXITCODE = 0
          @{probeExitCode=$code; sourceCommit=$env:GITHUB_SHA; scmInstalled='NOT_RUN'; pipeAuthorization='NOT_RUN'; tun='NOT_RUN'; scope='Read-only status and owned process-handle tests, no installed-service proof'} | ConvertTo-Json | Set-Content artifacts/v3d-validation/scope.json -Encoding utf8NoBOM
      - name: WPF navigation and version without network consent
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet run --project tests/AutoVpn.AuditRound6Wpf -c Release -- artifacts/v3d-wpf
          if ($LASTEXITCODE -ne 0) { throw 'WPF smoke failed.' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V3D-evidence-${{ github.sha }}-${{ matrix.os }}
          path: |
            artifacts/v3d-validation/
            artifacts/v3d-wpf/
          if-no-files-found: error
          retention-days: 30
