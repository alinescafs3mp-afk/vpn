name: astra-devkit-split
on:
  push:
    branches: [implementation/astra-r6-20261004]
    paths: [.github/workflows/astra-devkit-split.yml]
permissions:
  contents: read
  actions: read
jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: astra-offline-toolchain
          run-id: 37195591211
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs
      - shell: bash
        run: |
          set -euo pipefail
          split -b 300m inputs/sdk-packages.tar.xz inputs/sdk-part-
          ls -lh inputs/
          sha256sum inputs/sdk-part-* inputs/mihomo > inputs/PART-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: astra-sdk-part-aa
          path: inputs/sdk-part-aa
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: astra-sdk-part-ab
          path: inputs/sdk-part-ab
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: astra-test-core
          path: |
            inputs/mihomo
            inputs/PART-SHA256SUMS.txt
          retention-days: 1
          compression-level: 6
